openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: VRF Monitor LG - API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: systems
    description: VRF Systems management
  - name: startup-reports
    description: Startup report upload and management
  - name: reading-sessions
    description: Monthly LGMV reading sessions
  - name: dashboard
    description: Dashboard and summary views

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /systems:
    get:
      operationId: listSystems
      tags: [systems]
      summary: List all VRF systems (excludes trashed)
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [escritorios_xp, espacos_xp]
      responses:
        "200":
          description: List of systems
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VrfSystem"
    post:
      operationId: createSystem
      tags: [systems]
      summary: Create a new VRF system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VrfSystemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VrfSystem"

  /systems/dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard overview stats
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

  /systems/{systemId}:
    get:
      operationId: getSystem
      tags: [systems]
      summary: Get a VRF system
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: System found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VrfSystem"
        "404":
          description: Not found
    patch:
      operationId: updateSystem
      tags: [systems]
      summary: Update a VRF system
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VrfSystemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VrfSystem"
    delete:
      operationId: deleteSystem
      tags: [systems]
      summary: Soft-delete a VRF system (moves to trash)
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Moved to trash

  /systems/trash:
    get:
      operationId: listTrashedSystems
      tags: [systems]
      summary: List soft-deleted VRF systems in the trash (auto-expire after 30 days)
      responses:
        "200":
          description: List of trashed systems
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VrfSystem"

  /systems/{systemId}/restore:
    post:
      operationId: restoreSystem
      tags: [systems]
      summary: Restore a trashed VRF system
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VrfSystem"

  /systems/{systemId}/permanent:
    delete:
      operationId: permanentlyDeleteSystem
      tags: [systems]
      summary: Permanently delete a trashed VRF system
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Permanently deleted

  /systems/{systemId}/summary:
    get:
      operationId: getSystemSummary
      tags: [systems]
      summary: Get system health summary and trend
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: System health summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSummary"

  /systems/{systemId}/technical-report:
    get:
      operationId: exportTechnicalReport
      tags: [systems]
      summary: Export an editable Word technical report
      description: >
        Generates a DOCX report from persisted system, startup, reading,
        photo and AI-analysis data. If sessionId is omitted, all sessions are
        included. No new AI analysis is performed.
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: sessionId
          in: query
          required: false
          description: Export only this reading session when provided.
          schema:
            $ref: "#/components/schemas/ExportTechnicalReportQuery"
      responses:
        "200":
          description: Editable Word technical report attachment
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid systemId or sessionId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: System not found, deleted, or session does not belong to the system
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Report generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /systems/{systemId}/startup-reports:
    get:
      operationId: listStartupReports
      tags: [startup-reports]
      summary: List startup reports for a system
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of startup reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StartupReport"
    post:
      operationId: uploadStartupReport
      tags: [startup-reports]
      summary: Upload and process a startup report (PDF, JPG, PNG or WebP)
      description: Accepts PDF or image files up to 50 MB. The AI extracts baseline data from text and/or rendered pages via GPT-4o Vision.
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StartupReportUpload"
      responses:
        "201":
          description: Uploaded and processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartupReport"

  /systems/{systemId}/startup-reports/{reportId}:
    get:
      operationId: getStartupReport
      tags: [startup-reports]
      summary: Get a startup report
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Startup report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartupReport"
        "404":
          description: Not found
    delete:
      operationId: deleteStartupReport
      tags: [startup-reports]
      summary: Delete a startup report
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /systems/{systemId}/startup-reports/{reportId}/reprocess:
    post:
      operationId: reprocessStartupReport
      tags: [startup-reports]
      summary: Re-run AI processing on an existing startup report
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reprocessing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartupReport"
        "404":
          description: Not found

  /systems/{systemId}/reading-sessions:
    get:
      operationId: listReadingSessions
      tags: [reading-sessions]
      summary: List reading sessions for a system
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of reading sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadingSession"
    post:
      operationId: createReadingSession
      tags: [reading-sessions]
      summary: Create a new reading session
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingSessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingSession"

  /systems/{systemId}/reading-sessions/{sessionId}:
    get:
      operationId: getReadingSession
      tags: [reading-sessions]
      summary: Get a reading session with readings and analysis
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reading session detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingSessionDetail"
        "404":
          description: Not found

  /systems/{systemId}/reading-sessions/{sessionId}/photos:
    post:
      operationId: uploadReadingPhoto
      tags: [reading-sessions]
      summary: Upload a photo of LGMV readings for AI extraction
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PhotoUpload"
      responses:
        "201":
          description: Photo uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingPhoto"

  /systems/{systemId}/reading-sessions/{sessionId}/photos/{photoId}:
    delete:
      operationId: deleteReadingPhoto
      tags: [reading-sessions]
      summary: Delete a previously uploaded photo from a reading session
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
        - name: photoId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /systems/{systemId}/reading-sessions/{sessionId}/analyze:
    post:
      operationId: analyzeReadingSession
      tags: [reading-sessions]
      summary: Run AI analysis on uploaded photos to extract and evaluate readings
      parameters:
        - name: systemId
          in: path
          required: true
          schema:
            type: integer
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"

  /manufacturer-guide:
    get:
      operationId: getManufacturerGuideMetadata
      tags: [reading-sessions]
      summary: Metadata for the bundled LG Multi V 5 troubleshooting excerpt
      responses:
        "200":
          description: Bundled guide metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManufacturerGuideMetadata"

  /manufacturer-guide/pdf:
    get:
      operationId: getManufacturerGuidePdf
      tags: [reading-sessions]
      summary: Download the bundled manufacturer excerpt PDF
      responses:
        "200":
          description: PDF source
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /manufacturer-guide/pages/{page}:
    get:
      operationId: getManufacturerGuidePage
      tags: [reading-sessions]
      summary: Get one page image from the bundled manufacturer excerpt
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 66
      responses:
        "200":
          description: Original page image
          content:
            image/png:
              schema:
                type: string
                format: binary

components:
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ExportTechnicalReportQuery:
      type: integer
      minimum: 1

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    VrfSystem:
      type: object
      required: [id, code, name, category, vrfType, createdAt]
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [escritorios_xp, espacos_xp]
        deletedAt:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        floor:
          type: ["string", "null"]
        servedArea:
          type: ["string", "null"]
        model:
          type: ["string", "null"]
        vrfType:
          type: string
          enum: [multi_v_ii, multi_v_iii, multi_v_iv, multi_v_5]
        startupDate:
          type: ["string", "null"]
        building:
          type: ["string", "null"]
        condensationType:
          type: ["string", "null"]
          enum: [air, water, null]
        notes:
          type: ["string", "null"]
        healthStatus:
          type: ["string", "null"]
          enum: [healthy, warning, critical, null]
        lastReadingDate:
          type: ["string", "null"]
        createdAt:
          type: string

    VrfSystemInput:
      type: object
      required: [code, name, vrfType, category]
      properties:
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        category:
          type: string
          enum: [escritorios_xp, espacos_xp]
        location:
          type: string
        floor:
          type: string
        servedArea:
          type: string
        model:
          type: string
        vrfType:
          type: string
          enum: [multi_v_ii, multi_v_iii, multi_v_iv, multi_v_5]
        startupDate:
          type: string
        building:
          type: string
        condensationType:
          type: string
          enum: [air, water]
        notes:
          type: string

    VrfSystemUpdate:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [escritorios_xp, espacos_xp]
        location:
          type: string
        floor:
          type: string
        servedArea:
          type: string
        model:
          type: string
        vrfType:
          type: string
          enum: [multi_v_ii, multi_v_iii, multi_v_iv, multi_v_5]
        startupDate:
          type: string
        building:
          type: string
        condensationType:
          type: string
          enum: [air, water]
        notes:
          type: string

    Dashboard:
      type: object
      required: [totalSystems, healthySystems, warningSystems, criticalSystems, recentSessions, buildings]
      properties:
        totalSystems:
          type: integer
        healthySystems:
          type: integer
        warningSystems:
          type: integer
        criticalSystems:
          type: integer
        unknownSystems:
          type: integer
        recentSessions:
          type: array
          items:
            $ref: "#/components/schemas/ReadingSession"
        buildings:
          type: array
          items:
            $ref: "#/components/schemas/BuildingSummary"

    BuildingSummary:
      type: object
      required: [name, systemCount, healthySystems, warningSystems, criticalSystems, unknownSystems, systems]
      properties:
        name:
          type: string
        condensationType:
          type: ["string", "null"]
          enum: [air, water, null]
        systemCount:
          type: integer
        healthySystems:
          type: integer
        warningSystems:
          type: integer
        criticalSystems:
          type: integer
        unknownSystems:
          type: integer
        systems:
          type: array
          items:
            $ref: "#/components/schemas/VrfSystem"

    SystemSummary:
      type: object
      required: [system, totalSessions, latestHealthStatus, parameterTrends, hasStartupReport, usingLgReference]
      properties:
        system:
          $ref: "#/components/schemas/VrfSystem"
        totalSessions:
          type: integer
        latestHealthStatus:
          type: ["string", "null"]
        latestAnalysis:
          type: ["string", "null"]
        parameterTrends:
          type: array
          items:
            $ref: "#/components/schemas/ParameterTrend"
        hasStartupReport:
          type: boolean
          description: True quando existe ao menos um relatorio de partida processado com sucesso para o sistema.
        usingLgReference:
          type: boolean
          description: True quando o sistema vai utilizar a tabela referencia LG como baseline padrao (condensacao a Ar e sem relatorio de partida processado).

    ParameterTrend:
      type: object
      required: [parameter, unit, values]
      properties:
        parameter:
          type: string
        unit:
          type: string
        values:
          type: array
          items:
            type: object
            required: [date, value, status]
            properties:
              date:
                type: string
              value:
                type: ["number", "null"]
              status:
                type: string

    StartupReport:
      type: object
      required: [id, systemId, filename, uploadedAt, processingStatus]
      properties:
        id:
          type: integer
        systemId:
          type: integer
        filename:
          type: string
        fileUrl:
          type: ["string", "null"]
        uploadedAt:
          type: string
        processingStatus:
          type: string
          enum: [pending, processing, done, error]
        extractedData:
          type: ["object", "null"]
        errorMessage:
          type: ["string", "null"]

    StartupReportUpload:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary

    ReadingSession:
      type: object
      required: [id, systemId, sessionDate, mode, createdAt]
      properties:
        id:
          type: integer
        systemId:
          type: integer
        sessionDate:
          type: string
        mode:
          type: string
          enum: [cooling, heating]
        notes:
          type: ["string", "null"]
        healthStatus:
          type: ["string", "null"]
          enum: [healthy, warning, critical, null]
        analysisResult:
          type: ["string", "null"]
        createdAt:
          type: string

    ReadingSessionInput:
      type: object
      required: [sessionDate, mode]
      properties:
        sessionDate:
          type: string
        mode:
          type: string
          enum: [cooling, heating]
        notes:
          type: string

    ReadingSessionDetail:
      type: object
      required: [id, systemId, sessionDate, mode, createdAt, photos, readings]
      properties:
        id:
          type: integer
        systemId:
          type: integer
        sessionDate:
          type: string
        mode:
          type: string
          enum: [cooling, heating]
        notes:
          type: ["string", "null"]
        healthStatus:
          type: ["string", "null"]
        analysisResult:
          type: ["string", "null"]
        createdAt:
          type: string
        photos:
          type: array
          items:
            $ref: "#/components/schemas/ReadingPhoto"
        readings:
          type: array
          items:
            $ref: "#/components/schemas/LgmvReading"

    ReadingPhoto:
      type: object
      required: [id, sessionId, filename, fileUrl, uploadedAt]
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        filename:
          type: string
        fileUrl:
          type: string
        label:
          type: ["string", "null"]
        uploadedAt:
          type: string

    PhotoUpload:
      type: object
      required: [photo]
      properties:
        photo:
          type: string
          format: binary

    LgmvReading:
      type: object
      required: [id, sessionId, parameter, unit, status]
      properties:
        id:
          type: integer
        sessionId:
          type: integer
        parameter:
          type: string
        unit:
          type: string
        value:
          type: ["number", "null"]
        minNormal:
          type: ["number", "null"]
        maxNormal:
          type: ["number", "null"]
        status:
          type: string
          enum: [normal, warning, critical, unknown]
        baselineValue:
          type: ["number", "null"]
        deviationPercent:
          type: ["number", "null"]
        sourcePhotoId:
          type: ["integer", "null"]
        sourcePhotoLabel:
          type: ["string", "null"]

    AnalysisResult:
      type: object
      required: [sessionId, healthStatus, summary, readings, insights, recommendations]
      properties:
        sessionId:
          type: integer
        healthStatus:
          type: string
          enum: [healthy, warning, critical]
        summary:
          type: string
        readings:
          type: array
          items:
            $ref: "#/components/schemas/LgmvReading"
        insights:
          type: array
          items:
            type: string
        recommendations:
          type: array
          items:
            type: string
        maintenanceRequired:
          type: boolean
        manufacturerGuide:
          $ref: "#/components/schemas/ManufacturerGuide"

    ManufacturerGuideMetadata:
      type: object
      required: [version, documentId, title, year, language, scope, pageCount, printedPageRange, pdfUrl, pageUrlTemplate]
      properties:
        version:
          type: integer
          const: 1
        documentId:
          type: string
          const: lg-multi-v5-troubleshooting-2021
        title:
          type: string
        year:
          type: integer
          const: 2021
        language:
          type: string
          const: en
        scope:
          type: string
        pageCount:
          type: integer
          const: 66
        printedPageRange:
          type: string
        pdfUrl:
          type: string
        pageUrlTemplate:
          type: string

    ManufacturerGuide:
      type: object
      required: [version, documentId, title, status, safetyNotice, references, procedures]
      properties:
        version:
          type: integer
          const: 1
        documentId:
          type: string
          const: lg-multi-v5-troubleshooting-2021
        title:
          type: string
        status:
          type: string
          enum: [grounded, no_match, not_applicable, unavailable]
        reason:
          type: string
        safetyNotice:
          type: string
        references:
          type: array
          items:
            type: object
            required: [page, printedPage, title]
            properties:
              page:
                type: integer
              printedPage:
                type: string
              title:
                type: string
        procedures:
          type: array
          items:
            type: object
            required: [title, evidence, steps]
            properties:
              title:
                type: string
              evidence:
                type: string
              steps:
                type: array
                items:
                  type: object
                  required: [instruction, expectedResult, onPass, onFail, page, sourceQuote]
                  properties:
                    instruction:
                      type: string
                    expectedResult:
                      type: string
                    onPass:
                      type: string
                    onFail:
                      type: string
                    page:
                      type: integer
                    sourceQuote:
                      type: string
